<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Eenmalige installatie · Afspraakboeken.be</title><link rel="stylesheet" href="../portal.css?v=0.16.1"></head><body><main class="compact-auth"><section class="panel"><div id="brand"></div><h1>Jouw agencyomgeving.</h1><p class="sub">Maak na de databaseconfiguratie eenmalig je eigen superadminaccount aan.</p><form id="setup-form" class="fields"><label>Installatiesleutel<input name="key" type="password" autocomplete="off" minlength="32" required></label><label>Je naam<input name="name" autocomplete="name" maxlength="120" required></label><label>Je e-mailadres<input name="email" type="email" autocomplete="username" maxlength="190" required></label><label>Je wachtwoord<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label>Herhaal je wachtwoord<input name="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><p class="form-error" role="alert"></p><button type="submit" class="btn primary">Superadminaccount aanmaken</button><p class="field-help">De installatiesleutel staat in je privéconfiguratie op Hostinger. Deze installatie sluit automatisch zodra het eerste account bestaat.</p></form></section></main><script type="module" src="./setup.js?v=0.16.1"></script></body></html>
